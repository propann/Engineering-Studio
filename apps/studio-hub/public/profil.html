<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Fiche · Engineering Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #111311;
      --paper: #ebece6;
      --muted: #747970;
      --orange: #ff5a1f;
      --acid: #d9ff43;
      --blue: #4aa7ff;
    }
    body {
      font-family: "Courier New", monospace;
      background: var(--paper);
      color: var(--ink);
    }
    
    header {
      height: 82px;
      padding: 0 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--ink);
      background: #ebece6f2;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-symbol {
      width: 40px;
      height: 40px;
      background: #171917;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 7px;
    }
    .brand-symbol i { background: var(--acid); display: block; }
    .brand-symbol i:nth-child(2) { background: var(--blue); }
    .brand-symbol i:nth-child(3) { background: #ff693b; }
    .brand-symbol i:nth-child(4) { background: #f2ca45; }
    .brand span { display: flex; flex-direction: column; line-height: 0.85; font-size: 18px; }
    .brand strong { font-weight: 900; }
    
    .profile-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 50px 5vw;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
    }
    
    .profile-card {
      background: white;
      border: 3px solid var(--ink);
      padding: 24px;
      height: fit-content;
      position: sticky;
      top: 20px;
    }
    
    .avatar-display {
      width: 100%;
      height: 300px;
      background: #f5f5f3;
      border: 3px solid var(--ink);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .avatar-display img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .profile-info h1 {
      font-size: 22px;
      margin: 12px 0 6px;
      letter-spacing: -0.05em;
    }
    
    .profile-info p {
      font-size: 12px;
      color: #555b53;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    
    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 16px;
      border-top: 2px solid #ddd;
    }
    
    .stat-item {
      background: #fafaf8;
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }
    
    .stat-item b { display: block; font-size: 18px; margin-bottom: 4px; }
    .stat-item small { font-size: 9px; text-transform: uppercase; color: #999; }
    
    .profile-form {
      background: white;
      border: 3px solid var(--ink);
      padding: 24px;
    }
    
    .form-section {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 2px solid #f0f0ee;
    }
    
    .form-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    
    .form-section h3 {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--orange);
      margin-bottom: 12px;
    }
    
    .form-field {
      margin-bottom: 12px;
    }
    
    .form-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    
    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--ink);
      font-family: monospace;
      font-size: 12px;
    }
    
    .form-field textarea {
      resize: vertical;
      min-height: 60px;
    }
    
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 12px 0;
      max-height: 400px;
      overflow-y: auto;
      border: 2px solid #ddd;
      padding: 8px;
    }
    
    .avatar-option {
      aspect-ratio: 1;
      border: 2px solid #ddd;
      cursor: pointer;
      transition: 0.2s;
      overflow: hidden;
    }
    
    .avatar-option:hover {
      border-color: var(--orange);
      transform: scale(1.05);
    }
    
    .avatar-option.selected {
      border-color: var(--orange);
      background: #fff3e0;
    }
    
    .avatar-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .save-button {
      width: 100%;
      padding: 14px;
      background: var(--ink);
      color: white;
      border: 3px solid var(--ink);
      font-family: monospace;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: 0.2s;
    }
    
    .save-button:hover {
      background: var(--orange);
      border-color: var(--orange);
      transform: translate(-3px, -3px);
      box-shadow: 6px 6px 0 var(--ink);
    }
    
    @media(max-width: 768px) {
      .profile-container { grid-template-columns: 1fr; }
      .avatar-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="landing.html">
      <span class="brand-symbol"><i></i><i></i><i></i><i></i></span>
      <span><strong>Engineering</strong><b>Studio</b></span>
    </a>
    <div style="flex:1"></div>
    <a href="outils.html" style="padding: 12px 16px; border: 3px solid var(--ink); text-decoration: none; font-weight: bold; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;">
      LES OUTILS ↗
    </a>
  </header>

  <div class="profile-container">
    <aside class="profile-card">
      <div class="avatar-display">
        <img src="/media/avatars/pixel-avatar-engineer.svg" alt="Mon avatar" id="avatarPreview">
      </div>
      <div class="profile-info">
        <h1 id="profileName">SANS NOM</h1>
        <p id="profileBio">Écris quelques mots sur toi.</p>
        <div class="profile-stats">
          <div class="stat-item">
            <b id="machineCount">0</b>
            <small>Machines</small>
          </div>
          <div class="stat-item">
            <b id="progressCount">0</b>
            <small>%</small>
          </div>
        </div>
      </div>
    </aside>

    <main class="profile-form">
      <form onsubmit="saveProfile(event)">
        <!-- Identité -->
        <section class="form-section">
          <h3>📍 Identité</h3>
          <div class="form-field">
            <label>Pseudo</label>
            <input type="text" id="nameInput" maxlength="40" placeholder="Ton nom d'atelier" value="AZOTH">
          </div>
          <div class="form-field">
            <label>Présentation</label>
            <textarea id="bioInput" maxlength="160" placeholder="Qui es-tu ? Quoi tu fais ?">Inventeur de machines musicales et explorateur de fréquences.</textarea>
          </div>
        </section>

        <!-- Avatar -->
        <section class="form-section">
          <h3>🎭 Choisir un avatar (40 personnages)</h3>
          <div class="avatar-grid" id="avatarGrid"></div>
        </section>

        <!-- Équipement -->
        <section class="form-section">
          <h3>⚙️ Mes machines</h3>
          <div id="machinesList"></div>
          <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button type="button" onclick="addMachine('op1')" style="flex:1; padding: 10px; border: 2px solid var(--ink); background: white; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 10px;">+ OP-1</button>
            <button type="button" onclick="addMachine('ep133')" style="flex:1; padding: 10px; border: 2px solid var(--ink); background: white; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 10px;">+ EP-133</button>
          </div>
        </section>

        <!-- Workspace -->
        <section class="form-section">
          <h3>📁 Base de travail</h3>
          <div class="form-field">
            <label>Dossier local</label>
            <input type="text" id="workspaceInput" placeholder="Aucun dossier connecté">
          </div>
          <p style="font-size: 11px; color: #999; margin-top: 6px;">Tes fichiers restent sur ton ordinateur.</p>
        </section>

        <!-- Préférences -->
        <section class="form-section">
          <h3>🎛️ Préférences</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-field">
              <label>Langue</label>
              <select id="languageInput">
                <option>FR</option>
                <option>EN</option>
              </select>
            </div>
            <div class="form-field">
              <label>Clavier</label>
              <select id="keyboardInput">
                <option>AZERTY</option>
                <option>QWERTY</option>
              </select>
            </div>
          </div>
        </section>

        <button type="submit" class="save-button">💾 Enregistrer ma fiche</button>
      </form>
    </main>
  </div>

  <script>
    const avatarNames = ["teacher","carpenter","artist","barista","support","architect","activist","mail-carrier","builder","scientist","student","librarian","trainer","office-worker","influencer","chef","courier","grandma","musician","paramedic","knight","rogue","smith","archer","scholar","warrior","goblin","cyborg","cat-adventurer","pirate","sorceress","viking","engineer","necromancer","ranger","royal-guard","fighter","samurai","cultist","explorer"];
    
    let currentAvatar = "engineer";
    let machines = [{id: 1, kind: "op1", name: "OP-1"}, {id: 2, kind: "ep133", name: "EP-133", memory: 64}];

    // Remplir la grille d'avatars
    const grid = document.getElementById('avatarGrid');
    avatarNames.forEach((name) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `avatar-option ${name === currentAvatar ? 'selected' : ''}`;
      button.onclick = () => selectAvatar(name);
      button.innerHTML = `<img src="/media/avatars/pixel-avatar-${name}.svg" alt="${name}">`;
      grid.appendChild(button);
    });

    function selectAvatar(name) {
      currentAvatar = name;
      document.getElementById('avatarPreview').src = `/media/avatars/pixel-avatar-${name}.svg`;
      document.querySelectorAll('.avatar-option').forEach(btn => btn.classList.remove('selected'));
      event.target.closest('.avatar-option').classList.add('selected');
    }

    function updateMachinesList() {
      const list = document.getElementById('machinesList');
      list.innerHTML = machines.map((m, i) => `
        <div style="background: #fafaf8; padding: 12px; margin-bottom: 8px; border: 2px solid #ddd; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <strong style="display: block; font-size: 12px;">${m.kind.toUpperCase()} - ${m.name}</strong>
            ${m.memory ? `<small style="color: #999;">${m.memory} Mo</small>` : ''}
          </div>
          <button type="button" onclick="removeMachine(${i})" style="border: none; background: none; cursor: pointer; font-size: 16px; color: #999;">×</button>
        </div>
      `).join('');
      document.getElementById('machineCount').textContent = machines.length;
    }

    function addMachine(kind) {
      machines.push({
        id: Date.now(),
        kind: kind,
        name: kind.toUpperCase(),
        memory: kind === 'ep133' ? 64 : undefined
      });
      updateMachinesList();
    }

    function removeMachine(index) {
      machines.splice(index, 1);
      updateMachinesList();
    }

    function saveProfile(event) {
      event.preventDefault();
      const profile = {
        name: document.getElementById('nameInput').value,
        bio: document.getElementById('bioInput').value,
        avatar: currentAvatar,
        machines: machines,
        workspace: document.getElementById('workspaceInput').value,
        language: document.getElementById('languageInput').value,
        keyboard: document.getElementById('keyboardInput').value,
        savedAt: new Date().toISOString()
      };
      localStorage.setItem('studio-profile', JSON.stringify(profile));
      alert('✅ Profil sauvegardé !');
    }

    function loadProfile() {
      const saved = localStorage.getItem('studio-profile');
      if (saved) {
        const profile = JSON.parse(saved);
        document.getElementById('nameInput').value = profile.name || '';
        document.getElementById('bioInput').value = profile.bio || '';
        document.getElementById('workspaceInput').value = profile.workspace || '';
        document.getElementById('languageInput').value = profile.language || 'FR';
        document.getElementById('keyboardInput').value = profile.keyboard || 'AZERTY';
        currentAvatar = profile.avatar || 'engineer';
        machines = profile.machines || machines;
      }
      document.getElementById('profileName').textContent = document.getElementById('nameInput').value || 'SANS NOM';
      document.getElementById('profileBio').textContent = document.getElementById('bioInput').value || 'Écris quelques mots sur toi.';
      document.getElementById('avatarPreview').src = `/media/avatars/pixel-avatar-${currentAvatar}.svg`;
      updateMachinesList();
    }

    // Auto-mise à jour de l'aperçu
    document.getElementById('nameInput').addEventListener('input', () => {
      document.getElementById('profileName').textContent = event.target.value || 'SANS NOM';
    });
    document.getElementById('bioInput').addEventListener('input', () => {
      document.getElementById('profileBio').textContent = event.target.value || 'Écris quelques mots sur toi.';
    });

    loadProfile();
  </script>
</body>
</html>
