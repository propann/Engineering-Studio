<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliothèque Sonore · Engineering Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #111311;
      --paper: #ebece6;
      --orange: #ff5a1f;
      --acid: #d9ff43;
      --blue: #4aa7ff;
    }
    body {
      font-family: "Courier New", monospace;
      background: var(--paper);
      color: var(--ink);
    }
    
    header {
      height: 82px;
      padding: 0 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--ink);
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-symbol {
      width: 40px;
      height: 40px;
      background: #171917;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 7px;
    }
    .brand-symbol i { background: var(--acid); display: block; }
    .brand-symbol i:nth-child(2) { background: var(--blue); }
    .brand-symbol i:nth-child(3) { background: #ff693b; }
    .brand-symbol i:nth-child(4) { background: #f2ca45; }
    .brand span { display: flex; flex-direction: column; line-height: 0.85; font-size: 18px; }
    .brand strong { font-weight: 900; }
    
    .library-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 50px 5vw;
    }
    
    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--ink);
    }
    
    .library-header h1 {
      font-size: 42px;
      letter-spacing: -0.055em;
    }
    
    .search-box {
      flex: 1;
      max-width: 300px;
      margin: 0 20px;
      padding: 10px;
      border: 2px solid var(--ink);
      font-family: monospace;
    }
    
    .filter-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    
    .filter-tag {
      padding: 8px 12px;
      border: 2px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      transition: 0.2s;
    }
    
    .filter-tag:hover {
      border-color: var(--orange);
    }
    
    .filter-tag.active {
      background: var(--orange);
      color: white;
      border-color: var(--orange);
    }
    
    .sounds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    
    .sound-card {
      background: white;
      border: 3px solid var(--ink);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    
    .sound-card header {
      border: none;
      padding: 0;
      height: auto;
      display: block;
    }
    
    .sound-waveform {
      width: 100%;
      height: 60px;
      background: #f0f0ee;
      border: 2px solid #ddd;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding: 4px;
    }
    
    .sound-wave {
      flex: 1;
      background: var(--orange);
      height: 50%;
      margin: 0 2px;
      border-radius: 2px;
    }
    
    .sound-name {
      font-weight: 900;
      font-size: 12px;
      margin-bottom: 6px;
    }
    
    .sound-meta {
      font-size: 10px;
      color: #999;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    
    .sound-meta span {
      background: #fafaf8;
      padding: 4px 6px;
      border: 1px solid #ddd;
    }
    
    .sound-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    
    .sound-tag {
      background: #f0f0ee;
      padding: 3px 6px;
      font-size: 8px;
      border: 1px solid #ddd;
    }
    
    .sound-controls {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    
    .sound-controls button {
      flex: 1;
      padding: 8px;
      border: 2px solid var(--ink);
      background: white;
      cursor: pointer;
      font-family: monospace;
      font-weight: 700;
      font-size: 9px;
      transition: 0.2s;
    }
    
    .sound-controls button:hover {
      background: #f5f5f3;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="landing.html">
      <span class="brand-symbol"><i></i><i></i><i></i><i></i></span>
      <span><strong>Engineering</strong><b>Studio</b></span>
    </a>
    <a href="outils.html" style="border: 3px solid var(--ink); padding: 8px 12px; text-decoration: none; font-size: 9px; font-weight: bold; text-transform: uppercase;">← Retour</a>
  </header>

  <div class="library-container">
    <div class="library-header">
      <h1>Bibliothèque Sonore</h1>
      <input type="text" class="search-box" id="searchBox" placeholder="Chercher un son...">
    </div>

    <div class="filter-tags">
      <button class="filter-tag active" onclick="filterByType(this, 'all')">TOUS</button>
      <button class="filter-tag" onclick="filterByType(this, 'kick')">KICKS</button>
      <button class="filter-tag" onclick="filterByType(this, 'pad')">PADS</button>
      <button class="filter-tag" onclick="filterByType(this, 'synth')">SYNTH</button>
      <button class="filter-tag" onclick="filterByType(this, 'percussion')">PERCUSSION</button>
      <button class="filter-tag" onclick="filterByType(this, 'ambient')">AMBIENT</button>
    </div>

    <div class="sounds-grid" id="soundsGrid"></div>
  </div>

  <script>
    const sounds = [
      { id: 1, name: 'Deep Bass Kick', type: 'kick', duration: '1.2s', bpm: '120', tags: ['kick', '808', 'deep'] },
      { id: 2, name: 'Electric Pad', type: 'pad', duration: '4.5s', bpm: '—', tags: ['pad', 'synth'] },
      { id: 3, name: 'Snare Snap', type: 'percussion', duration: '0.4s', bpm: '120', tags: ['snare', 'drum'] },
      { id: 4, name: 'Vintage Synth', type: 'synth', duration: '2.8s', bpm: '—', tags: ['synth', 'retro'] },
      { id: 5, name: 'Ambient Drone', type: 'ambient', duration: '8.0s', bpm: '—', tags: ['ambient', 'drone'] },
      { id: 6, name: 'Closed Hat', type: 'percussion', duration: '0.2s', bpm: '120', tags: ['hat', 'drum'] },
      { id: 7, name: 'Warm Pad', type: 'pad', duration: '5.2s', bpm: '—', tags: ['pad', 'warm'] },
      { id: 8, name: 'Impact Kick', type: 'kick', duration: '1.5s', bpm: '130', tags: ['kick', 'impact'] },
      { id: 9, name: 'Chiptune Bell', type: 'synth', duration: '1.0s', bpm: '—', tags: ['synth', 'bell'] },
      { id: 10, name: 'Floating Pad', type: 'ambient', duration: '6.0s', bpm: '—', tags: ['ambient', 'pad'] },
      { id: 11, name: 'Punchy Kick', type: 'kick', duration: '0.9s', bpm: '128', tags: ['kick', 'punchy'] },
      { id: 12, name: 'Glitchy Percuss', type: 'percussion', duration: '0.3s', bpm: '—', tags: ['percussion', 'glitch'] },
    ];

    function renderSounds(filtered) {
      const grid = document.getElementById('soundsGrid');
      grid.innerHTML = filtered.map(sound => `
        <div class="sound-card">
          <div class="sound-waveform">
            ${Array(8).fill(0).map(() => `<div class="sound-wave" style="height: ${Math.random() * 100}%"></div>`).join('')}
          </div>
          <div class="sound-name">${sound.name}</div>
          <div class="sound-meta">
            <span>⏱ ${sound.duration}</span>
            <span>♪ ${sound.bpm}</span>
          </div>
          <div class="sound-tags">
            ${sound.tags.map(tag => `<span class="sound-tag">${tag.toUpperCase()}</span>`).join('')}
          </div>
          <div class="sound-controls">
            <button onclick="playSound(${sound.id})">▶ PLAY</button>
            <button onclick="downloadSound(${sound.id})">⬇</button>
          </div>
        </div>
      `).join('');
    }

    function filterByType(btn, type) {
      document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      const filtered = type === 'all' ? sounds : sounds.filter(s => s.type === type);
      renderSounds(filtered);
    }

    function playSound(id) {
      alert(`▶ Lecture du son #${id}`);
    }

    function downloadSound(id) {
      const sound = sounds.find(s => s.id === id);
      alert(`⬇ Téléchargement de : ${sound.name}`);
    }

    document.getElementById('searchBox').addEventListener('input', (e) => {
      const search = e.target.value.toLowerCase();
      const filtered = sounds.filter(s => s.name.toLowerCase().includes(search));
      renderSounds(filtered);
    });

    renderSounds(sounds);
  </script>
</body>
</html>
