<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering Studio - Landing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #111311;
      --paper: #ebece6;
      --muted: #747970;
      --orange: #ff5a1f;
      --acid: #d9ff43;
    }
    body {
      font-family: "Courier New", monospace;
      background: var(--paper);
      color: var(--ink);
    }
    header {
      height: 82px;
      padding: 0 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--ink);
      background: #ebece6f2;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-symbol {
      width: 40px;
      height: 40px;
      background: #171917;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 7px;
    }
    .brand-symbol i {
      background: var(--acid);
      display: block;
    }
    .brand strong { font-weight: 900; }
    .brand b { font-weight: 400; }
    .hero {
      padding: 78px 7vw;
      background: #dfe1da;
      background-image: linear-gradient(#1111110d 2px, transparent 2px),
                        linear-gradient(90deg, #1111110d 2px, transparent 2px);
      background-size: 32px 32px;
    }
    .hero h1 {
      font-size: 72px;
      line-height: 0.79;
      letter-spacing: -0.075em;
      text-transform: uppercase;
      margin: 20px 0 24px;
      max-width: 500px;
    }
    .hero em { color: var(--orange); font-style: normal; }
    .hero p { font-size: 18px; line-height: 1.55; max-width: 540px; color: #555a53; }
    .hero-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    button, a.btn {
      padding: 16px 20px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: #111;
      color: #fff;
      text-transform: uppercase;
      font: 900 11px monospace;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 38px;
    }
    button:hover {
      background: var(--orange);
      color: #111;
      transform: translate(-3px, -3px);
      box-shadow: 9px 9px 0 #111;
    }
    .local-note {
      margin-top: 28px;
      font: 600 10px monospace;
      color: #656961;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#top">
      <span class="brand-symbol"><i></i><i></i><i></i><i></i></span>
      <div><strong>Engineering</strong><b>Studio</b></div>
    </a>
    <nav></nav>
    <button>PROFIL →</button>
  </header>

  <section class="hero" id="top">
    <h1>Construis.<br/>Connecte.<br/><em>Crée.</em></h1>
    <p>Un seul espace pour piloter tes machines, façonner tes sons et transformer les idées en instruments.</p>
    <div class="hero-actions">
      <button>Ouvrir les outils <span>→</span></button>
      <button>Créer ma fiche <span>→</span></button>
    </div>
    <div class="local-note">◐ Aucun compte. Aucun cloud imposé. Tes fichiers restent chez toi.</div>
  </section>
</body>
</html>
