name: CI — tests, image, sécurité

# Coolify déploie `main` tout seul, en surveillant le dépôt. Ce workflow ne
# déploie rien : il vérifie.
#
# Il ne se déclenchait que sur `deploy/coolify-production`, une branche que
# Coolify n'utilise pas. Les deux ne se rencontraient donc jamais : ce qui
# partait en production n'était jamais testé, et ce qui était testé n'était
# jamais déployé. Constaté le 2026-08-21, avec 9 commits d'écart.
#
# `validation` sert à voir le résultat AVANT de fusionner dans main, pour les
# changements sensibles. Pousser directement sur main reste possible — les
# tests tournent quand même, on est simplement prevenu apres coup.

on:
  push:
    branches:
      - main
      - validation
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Pas de filtre `paths` : il excluait vite.config.ts, package.json, bun.lock et
# tsconfig.json — exactement les fichiers dont une modification casse la
# construction sans toucher au code. La suite complete prend moins de deux
# secondes ; filtrer ne faisait economiser rien et laissait passer l'essentiel.

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Verify production build
        run: bun run build


  security-scan-source:
    name: Source Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository with Trivy
        run: |
          docker run --rm             -v "${GITHUB_WORKSPACE}:/repo"             aquasec/trivy:0.56.2             fs /repo             --scanners vuln,secret,misconfig             --format sarif             --output /repo/trivy-source-results.sarif             --severity CRITICAL,HIGH             --ignore-unfixed
      - name: Upload source scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-source-results.sarif


  studio-op1:
    name: OP-1 Studio Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install root dependencies for shared sources
        run: npm install --package-lock=false --ignore-scripts
      - name: Link private workspace packages
        working-directory: apps/op1-studio
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies['@studio-hub/audio-bridge']='file:../../packages/audio-bridge'; p.dependencies['@studio-hub/midi-bridge']='file:../../packages/midi-bridge'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"
      - name: Install dependencies
        working-directory: apps/op1-studio
        run: npm install --package-lock=false --ignore-scripts ../../packages/audio-bridge ../../packages/audio-formats ../../packages/fs-handles ../../packages/midi-bridge ../../packages/midi-dispatch ../../packages/musique
      - name: Type check
        working-directory: apps/op1-studio
        run: npm run typecheck
      - name: Test
        working-directory: apps/op1-studio
        # `npm test` appelle `vinext build`, mais ce dépôt ne fournit pas d'index.html :
        # les tests Node ci-dessous sont la suite réellement maintenue de ce studio.
        run: node --test tests/rendered-html.test.mjs tests/audio-oracle.test.mjs tests/aiff-patch-oracle.test.mjs tests/midi-file-import.test.mjs tests/audio-convert.test.mjs

  studio-ep133:
    name: EP-133 Studio Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install root dependencies for shared sources
        run: npm install --package-lock=false --ignore-scripts
      - name: Link private workspace packages
        working-directory: apps/ep133-studio
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies['@studio-hub/audio-bridge']='file:../../packages/audio-bridge'; p.dependencies['@studio-hub/midi-bridge']='file:../../packages/midi-bridge'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"
      - name: Install dependencies
        working-directory: apps/ep133-studio
        run: npm install --package-lock=false --ignore-scripts ../../packages/audio-bridge ../../packages/audio-formats ../../packages/fs-handles ../../packages/midi-bridge ../../packages/midi-dispatch ../../packages/musique
      - name: Type check
        working-directory: apps/ep133-studio
        run: npm run typecheck
      - name: Test
        working-directory: apps/ep133-studio
        run: npm run test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          # Le nom d'un depot d'images doit etre en MINUSCULES. `github.repository`
          # vaut ici « propann/Engineering-Studio », avec des majuscules, ce qui
          # faisait echouer buildx avec « repository name must be lowercase ».
          # La construction de l'image n'avait donc jamais abouti, sur aucune
          # branche — personne ne le voyait, le workflow ne tournant que sur une
          # branche que rien ne deployait.
          depot=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${depot}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "tag-latest=ghcr.io/${depot}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Construire partout, ne PUBLIER que depuis main.
          #
          # Sauter le job entier hors de main paraissait economique, mais rendait
          # impossible de valider une correction touchant a l'image avant de la
          # fusionner — exactement le cas du nom en majuscules corrige ici.
          # Construire sans publier coute une minute et attrape les erreurs de
          # Dockerfile et d'etiquette la ou il faut : avant main.
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.tag-latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    # Trivy analyse l'image PUBLIEE, qu'il recupere depuis le registre. Hors de
    # main l'image est construite mais pas poussee : il n'y aurait rien a tirer,
    # et l'etape echouerait pour une raison sans rapport avec la securite.
    #
    # Consequence assumee : ce job ne se verifie que sur main, contrairement aux
    # deux autres. Il n'y a pas moyen de faire autrement sans publier depuis
    # `validation`, ce qui encombrerait le registre.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Sans cette permission, le televersement echoue sur « Resource not
    # accessible by integration » — apres que Trivy a pourtant fini son analyse.
    # Le job semble alors signaler un probleme de securite ; il ne signale qu'un
    # droit manquant.
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy"
          docker run --rm             -v "${RUNNER_TEMP}/trivy:/out"             aquasec/trivy:0.56.2             image "${{ needs.build.outputs.image-tag }}"             --format sarif             --output /out/trivy-results.sarif             --severity CRITICAL,HIGH             --ignore-unfixed
          cp "${RUNNER_TEMP}/trivy/trivy-results.sarif" trivy-results.sarif

      # v3 obligatoire : les versions 1 et 2 de l'action CodeQL sont depreciees
      # depuis janvier 2025 et echouent desormais.
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

# Les jobs `deploy` et `notify` ont ete retires.
#
# Ils appelaient l'API Coolify avec COOLIFY_API_TOKEN / COOLIFY_WEBHOOK_URL et
# Slack avec SLACK_WEBHOOK — trois secrets jamais renseignes, donc trois etapes
# qui echouaient systematiquement.
#
# Surtout, ils faisaient doublon : Coolify surveille le depot directement et
# redeploie de lui-meme. Faire commander le deploiement par GitHub n'apportait
# rien qui ne se produise deja.
#
# Ce workflow ne garde donc que sa fonction utile : verifier que le code
# compile et que l'image se construit, avant que Coolify ne deploie.
#
# Pour retablir un declenchement pilote par GitHub, il faudrait creer un jeton
# d'API dans Coolify et le poser ici :
#     gh secret set COOLIFY_API_TOKEN
#     gh secret set COOLIFY_WEBHOOK_URL
