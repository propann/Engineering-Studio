name: Deploy to Coolify

on:
  push:
    branches:
      - deploy/coolify-production
    paths:
      - 'apps/studio-hub/**'
      - 'packages/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Verify production build
        run: bun run build

      # NOTE: pas d'étape de tests — aucun runner n'est installé à la racine
      # (ni vitest ni jest dans devDependencies, pas de script `test`).
      # Réactiver ce bloc une fois vitest ajouté :
      #   - name: Run tests
      #     run: npm run test -- --run --coverage
      #   - name: Upload coverage
      #     uses: codecov/codecov-action@v3

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set image tag
        id: image
        run: |
          echo "tag=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "tag-latest=ghcr.io/${{ github.repository }}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.tag-latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: success()

    steps:
      - uses: actions/checkout@v3

      - name: Trigger Coolify deployment
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -d '{
              "image": "${{ needs.build.outputs.image-tag }}",
              "environment": "production",
              "version": "${{ github.sha }}",
              "message": "Deployed from GitHub Actions"
            }' \
            ${{ secrets.COOLIFY_WEBHOOK_URL }}

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Studio Hub Deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
            Image: ${{ needs.build.outputs.image-tag }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  notify:
    name: Post Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Post to Slack
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Studio Hub deployed successfully!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Studio Hub Deployment* ✅\n*Branch:* ${{ github.ref }}\n*Commit:* ${{ github.sha }}\n*Environment:* Production"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
