name: CI — tests, image, sécurité

# Coolify déploie `main` tout seul, en surveillant le dépôt. Ce workflow ne
# déploie rien : il vérifie.
#
# Il ne se déclenchait que sur `deploy/coolify-production`, une branche que
# Coolify n'utilise pas. Les deux ne se rencontraient donc jamais : ce qui
# partait en production n'était jamais testé, et ce qui était testé n'était
# jamais déployé. Constaté le 2026-08-21, avec 9 commits d'écart.
#
# `validation` sert à voir le résultat AVANT de fusionner dans main, pour les
# changements sensibles. Pousser directement sur main reste possible — les
# tests tournent quand même, on est simplement prevenu apres coup.

on:
  push:
    branches:
      - main
      - validation
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Pas de filtre `paths` : il excluait vite.config.ts, package.json, bun.lock et
# tsconfig.json — exactement les fichiers dont une modification casse la
# construction sans toucher au code. La suite complete prend moins de deux
# secondes ; filtrer ne faisait economiser rien et laissait passer l'essentiel.

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Verify production build
        run: bun run build

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    # L'image n'est publiee que pour main. Sur `validation` et sur une pull
    # request, seuls les tests comptent : publier une image pour du travail non
    # fusionne encombrerait le registre sans que rien ne la consomme.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set image tag
        id: image
        run: |
          # Le nom d'un depot d'images doit etre en MINUSCULES. `github.repository`
          # vaut ici « propann/Engineering-Studio », avec des majuscules, ce qui
          # faisait echouer buildx avec « repository name must be lowercase ».
          # La construction de l'image n'avait donc jamais abouti, sur aucune
          # branche — personne ne le voyait, le workflow ne tournant que sur une
          # branche que rien ne deployait.
          depot=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${depot}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "tag-latest=ghcr.io/${depot}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.tag-latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

# Les jobs `deploy` et `notify` ont ete retires.
#
# Ils appelaient l'API Coolify avec COOLIFY_API_TOKEN / COOLIFY_WEBHOOK_URL et
# Slack avec SLACK_WEBHOOK — trois secrets jamais renseignes, donc trois etapes
# qui echouaient systematiquement.
#
# Surtout, ils faisaient doublon : Coolify surveille le depot directement et
# redeploie de lui-meme. Faire commander le deploiement par GitHub n'apportait
# rien qui ne se produise deja.
#
# Ce workflow ne garde donc que sa fonction utile : verifier que le code
# compile et que l'image se construit, avant que Coolify ne deploie.
#
# Pour retablir un declenchement pilote par GitHub, il faudrait creer un jeton
# d'API dans Coolify et le poser ici :
#     gh secret set COOLIFY_API_TOKEN
#     gh secret set COOLIFY_WEBHOOK_URL
