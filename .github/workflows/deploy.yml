name: Deploy to Coolify

on:
  push:
    branches:
      - deploy/coolify-production
    paths:
      - 'apps/studio-hub/**'
      - 'packages/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Verify production build
        run: bun run build

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set image tag
        id: image
        run: |
          echo "tag=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "tag-latest=ghcr.io/${{ github.repository }}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.tag-latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

# Les jobs `deploy` et `notify` ont ete retires.
#
# Ils appelaient l'API Coolify avec COOLIFY_API_TOKEN / COOLIFY_WEBHOOK_URL et
# Slack avec SLACK_WEBHOOK — trois secrets jamais renseignes, donc trois etapes
# qui echouaient systematiquement.
#
# Surtout, ils faisaient doublon : Coolify surveille le depot directement et
# redeploie de lui-meme. Faire commander le deploiement par GitHub n'apportait
# rien qui ne se produise deja.
#
# Ce workflow ne garde donc que sa fonction utile : verifier que le code
# compile et que l'image se construit, avant que Coolify ne deploie.
#
# Pour retablir un declenchement pilote par GitHub, il faudrait creer un jeton
# d'API dans Coolify et le poser ici :
#     gh secret set COOLIFY_API_TOKEN
#     gh secret set COOLIFY_WEBHOOK_URL
